name: Recover v0.0.1 Linux packages

on:
  push:
    tags: ['ci-repack-v0.0.1']

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '36589548838'
  RELEASE_TAG: v0.0.1

jobs:
  verify-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require the exact tagged source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "ci-repack-$RELEASE_TAG"
          python tools/release/manifest.py check-version Cargo.toml "$RELEASE_TAG"
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tagged_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          read -r source_commit source_branch source_event source_conclusion <<< "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '[.head_sha, .head_branch, .event, .conclusion] | @tsv')"
          test "$source_commit" = "$tagged_commit"
          test "$source_branch" = "$RELEASE_TAG"
          test "$source_event" = push
          test "$source_conclusion" = failure
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to republish' >&2
            exit 1
          fi

  linux-appimage:
    needs: verify-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-${{ matrix.arch }}
          path: native
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Install runtime libraries required by the native binary
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config gcc g++ clang libssl-dev libzstd-dev libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libvulkan-dev libvulkan1 libdbus-1-dev
      - name: Package and smoke-test AppImage
        env:
          ARCH: ${{ matrix.arch }}
        run: bash tools/release/package_linux.sh "${RELEASE_TAG#v}" "$ARCH" native/perch dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [verify-source, linux-appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          path: dist
          merge-multiple: true
      - name: Verify all six assets and manifest
        run: |
          python tools/release/manifest.py check-version Cargo.toml "$RELEASE_TAG"
          python tools/release/manifest.py generate "${RELEASE_TAG#v}" dist dist/update.json
          test -s docs/media/perch-tour.mp4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: |
            dist/*
            docs/media/perch-tour.mp4
          body: |
            Six native builds (Windows per-user installers, Linux AppImages, macOS unsigned apps).
            macOS apps are unsigned and must be installed manually; macOS may require opening them via the context menu.
