[package]
name = "perch"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.6.6", features = ["tree-sitter-rust", "tree-sitter-python", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-bash"] }
gpui-kit-assets = "0.6.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "process", "net"] }
futures = "0.3"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
url = "2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
data-url = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
base64 = "0.22"
rfd = "0.15"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
