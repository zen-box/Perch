[package]
name = "perch"
version = "0.0.1"
edition = "2024"

[features]
video-demo = []

[dependencies]
gpui-kit = { version = "0.6.6", features = ["tree-sitter-rust", "tree-sitter-python", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-bash"] }
gpui-kit-assets = "0.6.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
# io-util 是给 MCP 那条路用的：要按行读子进程的 stderr（`AsyncBufReadExt::lines`）。
# 本来 rmcp 的 transport-child-process 也会把它打开，但既然我们自己直接用了这个 API，
# 就显式写上，别靠别的 crate 顺手打开。
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "process", "net", "io-util"] }
futures = "0.3"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
url = "2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
data-url = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
base64 = "0.22"
rfd = "0.15"
sha2 = "0.10"
# MCP 官方 Rust SDK。stdio（子进程）和 Streamable HTTP 两条路都接。
# ⚠️ 后者的坑：rmcp 自己的 reqwest 是 `default-features = false`、**不带 TLS**，
# 只开 `transport-streamable-http-client-reqwest` 的话 https 的服务器连不上
# （握手阶段报 TLS 相关的错，看不出是缺 feature）。所以还要显式挑一个 TLS 后端——
# 这里选 `reqwest`（= rustls），和上面渠道那条路用的是同一个后端，
# 不会把 native-tls 也编进来。
rmcp = { version = "3.4.1", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
# `StreamableHttpClientTransportConfig::custom_headers` 收的是
# `HashMap<HeaderName, HeaderValue>`，这两个类型在 `http` 里，rmcp 没有 re-export。
# 版本跟着 rmcp 自己依赖的那个（都是 1.x），不会编出两份。
http = "1"

[dev-dependencies]
tempfile = "3"
